name: Top-down 3D smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/tavernborne-preview.log 2>&1 &
          echo $! > /tmp/tavernborne-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/tavernborne/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tavernborne-preview.log
          exit 1

      - name: Test top-down 3D world in Chromium
        run: node scripts/topdown-3d-smoke.mjs

      - name: Upload 3D diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topdown-3d-diagnostics
          path: topdown-3d-diagnostics.txt
          if-no-files-found: ignore

      - name: Upload 3D screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topdown-3d-screenshot
          path: topdown-3d-smoke.png
          if-no-files-found: ignore
