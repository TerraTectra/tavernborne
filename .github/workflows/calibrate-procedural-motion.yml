name: Calibrate procedural motion once

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/calibrate-procedural-motion.mjs
      - .github/workflows/calibrate-procedural-motion.yml

permissions:
  contents: write

jobs:
  calibrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/procedural-motion-foundation-v1
          fetch-depth: 0

      - name: Apply and clean calibration
        run: node scripts/calibrate-procedural-motion.mjs

      - name: Commit calibrated solver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Calibrate motion recovery before falling"
          git push origin HEAD:agent/procedural-motion-foundation-v1
