name: Verify live visual dungeon exploration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Test public GitHub Pages with deployment retries
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3 4; do
            echo "Live dungeon test attempt $attempt"
            TEST_URL=https://terratectra.github.io/tavernborne/ node scripts/dungeon-exploration-smoke.mjs 2>&1 | tee live-dungeon-diagnostics.txt
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            sleep 35
          done
          exit "$status"

      - name: Upload live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-dungeon-diagnostics
          path: live-dungeon-diagnostics.txt
          if-no-files-found: ignore

      - name: Upload live screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-dungeon-screenshot
          path: dungeon-exploration-smoke.png
          if-no-files-found: ignore
