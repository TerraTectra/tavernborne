name: Final public Conversation Consequences v1 verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Wait for fixed public asset manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_URL="https://terratectra.github.io/tavernborne/assets/quaternius/manifest.json"
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error --location \
              -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
              "${MANIFEST_URL}?verify=${GITHUB_RUN_ID}-${attempt}" -o public-manifest.json || true
            if python - <<'PY'
          import json
          from pathlib import Path
          path = Path('public-manifest.json')
          if not path.exists():
              raise SystemExit(1)
          try:
              manifest = json.loads(path.read_text(encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          entries = list((manifest.get('models') or {}).values()) + list((manifest.get('characters') or {}).values())
          total = sum(int(entry.get('externalDependencies') or 0) for entry in entries)
          raise SystemExit(0 if total > 0 else 1)
          PY
            then
              echo "Fixed public Quaternius manifest found"
              exit 0
            fi
            echo "Attempt $attempt: fixed public asset manifest not published yet"
            sleep 10
          done
          echo "Fixed Quaternius manifest was not found on GitHub Pages"
          exit 1

      - name: Verify public Conversation Consequences v1 in Chromium
        env:
          TEST_URL: https://terratectra.github.io/tavernborne/
        run: node scripts/conversation-consequences-smoke.mjs

      - name: Upload final public verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-public-conversation-consequences-v1-verification
          path: |
            conversation-consequences-diagnostics.json
            conversation-consequences-promise.png
            conversation-consequences-fulfilled.png
            conversation-consequences-broken.png
            conversation-consequences-future-memory.png
            conversation-consequences-final.png
            public-manifest.json
          if-no-files-found: ignore
