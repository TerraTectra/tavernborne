name: Procedural motion foundation smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: procedural-motion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check browser smoke syntax
        run: node --check scripts/procedural-motion-foundation-smoke.mjs

      - name: Build application and assets
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/tavernborne-procedural-motion-preview.log 2>&1 &
          echo $! > /tmp/tavernborne-procedural-motion-preview.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/tavernborne/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tavernborne-procedural-motion-preview.log
          exit 1

      - name: Test joint trajectories, contacts, balance, and recovery
        run: |
          set +e
          node scripts/procedural-motion-foundation-smoke.mjs > procedural-motion-test.log 2>&1
          status=$?
          cat procedural-motion-test.log
          exit $status

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procedural-motion-foundation-diagnostics
          path: |
            procedural-motion-diagnostics.json
            procedural-motion-test.log
            procedural-motion-*.png
            /tmp/tavernborne-procedural-motion-preview.log
          if-no-files-found: ignore
