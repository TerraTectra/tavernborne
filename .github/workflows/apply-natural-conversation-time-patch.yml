name: Apply natural conversation and time patch

on:
  push:
    branches:
      - agent/natural-conversation-and-time-scale
    paths:
      - scripts/apply-natural-conversation-time-patch.mjs
      - .github/workflows/apply-natural-conversation-time-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/natural-conversation-and-time-scale

      - name: Apply exact source replacements
        run: node scripts/apply-natural-conversation-time-patch.mjs

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rts/RTSGameV2.tsx src/rts/realtime.ts src/simulation/schedule.ts
          git commit -m "Slow realtime clock and simplify casual conversation labels"
          git push origin HEAD:agent/natural-conversation-and-time-scale
