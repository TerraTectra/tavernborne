name: Verify live top-down 3D

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test public GitHub Pages with deployment retries
        env:
          TEST_URL: https://terratectra.github.io/tavernborne/
        run: |
          set +e
          for attempt in 1 2 3 4 5 6; do
            echo "Public 3D verification attempt $attempt"
            node scripts/topdown-3d-smoke.mjs
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            sleep 20
          done
          exit "$status"

      - name: Upload live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-topdown-3d-diagnostics
          path: topdown-3d-diagnostics.txt
          if-no-files-found: ignore

      - name: Upload live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-topdown-3d-screenshots
          path: topdown-3d-*.png
          if-no-files-found: ignore
