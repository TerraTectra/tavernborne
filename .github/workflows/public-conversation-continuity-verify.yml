name: Public Conversation Continuity v1 verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Wait for merged public bundle
        run: |
          set -euo pipefail
          PUBLIC_URL="https://terratectra.github.io/tavernborne/"
          for attempt in {1..84}; do
            curl -fsS "$PUBLIC_URL" -o public-index.html || true
            asset="$(grep -oE 'assets/index-[^"[:space:]]+\.js' public-index.html | head -n 1 || true)"
            if [ -n "$asset" ]; then
              curl -fsS "${PUBLIC_URL}${asset}" -o public-bundle.js || true
              if grep -Fq 'Продолжу эту мысль' public-bundle.js \
                && grep -Fq 'Я услышал тебя' public-bundle.js \
                && grep -Fq 'conversationUsesPriorLine' public-bundle.js; then
                echo "Merged Conversation Continuity v1 bundle found: $asset"
                exit 0
              fi
            fi
            echo "Attempt $attempt: merged bundle not visible yet"
            sleep 10
          done
          echo "Merged Conversation Continuity v1 bundle was not published in time"
          exit 1

      - name: Verify public Conversation Continuity v1 in Chromium
        env:
          TEST_URL: https://terratectra.github.io/tavernborne/
        run: node scripts/conversation-continuity-smoke.mjs

      - name: Upload public continuity verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-conversation-continuity-v1-verification
          path: |
            conversation-continuity-diagnostics.json
            conversation-continuity-acknowledge.png
            conversation-continuity-challenge.png
            conversation-continuity-repair.png
            conversation-continuity-council.png
            conversation-continuity-final.png
          if-no-files-found: ignore
