name: Verify public Commitment Negotiation v1

on:
  pull_request:
    branches:
      - verify-base/commitment-negotiation-public
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify merged public deployment
        env:
          TEST_URL: https://terratectra.github.io/tavernborne/
        run: |
          for attempt in {1..8}; do
            echo "Public verification attempt ${attempt}/8"
            if node scripts/commitment-negotiation-smoke.mjs \
              && node scripts/commitment-negotiation-loop-smoke.mjs \
              && node scripts/commitment-reasoning-smoke.mjs \
              && node scripts/conversation-consequences-smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then
              sleep 25
            fi
          done
          exit 1

      - name: Upload public verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-commitment-negotiation-v1-diagnostics
          path: |
            commitment-negotiation-*.json
            commitment-negotiation-*.png
            commitment-reasoning-diagnostics.json
            commitment-reasoning-*.png
            conversation-consequences-diagnostics.json
            conversation-consequences-*.png
          if-no-files-found: ignore
