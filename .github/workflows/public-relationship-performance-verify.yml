name: Public Relationship Performance v1 verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Wait for merged public bundle
        run: |
          SITE='https://terratectra.github.io/tavernborne/'
          for attempt in {1..72}; do
            HTML="$(curl -fsS "$SITE" || true)"
            SCRIPT="$(printf '%s' "$HTML" | grep -oE 'src="[^"]+\.js"' | head -n1 | cut -d'"' -f2)"
            if [ -n "$SCRIPT" ]; then
              case "$SCRIPT" in
                http*) URL="$SCRIPT" ;;
                /*) URL="https://terratectra.github.io$SCRIPT" ;;
                *) URL="${SITE}${SCRIPT#./}" ;;
              esac
              if curl -fsS "$URL" | grep -q 'держится по-семейному близко'; then
                echo "Merged Relationship Performance v1 bundle detected: $URL"
                exit 0
              fi
            fi
            echo "Attempt $attempt: merged bundle not visible yet"
            sleep 10
          done
          echo 'Timed out waiting for Relationship Performance v1 on GitHub Pages.'
          exit 1

      - name: Verify public Relationship Performance v1 in Chromium
        env:
          TEST_URL: https://terratectra.github.io/tavernborne/
        run: node scripts/relationship-performance-smoke.mjs

      - name: Upload public relationship verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-relationship-performance-v1-verification
          path: |
            relationship-performance-diagnostics.json
            relationship-performance-*.png
          if-no-files-found: ignore
