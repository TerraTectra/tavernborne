name: RTS browser smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build application
        id: build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build-output.log
          if-no-files-found: error

      - name: Stop on build failure
        if: steps.build.outputs.status != '0'
        run: exit 1

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/tavernborne-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/tavernborne/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tavernborne-preview.log
          exit 1

      - name: Test public GitHub Pages in Chromium
        id: browser_test
        shell: bash
        env:
          TEST_URL: https://terratectra.github.io/tavernborne/
        run: |
          set +e
          node scripts/ui-smoke.mjs 2>&1 | tee ui-smoke-output.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: ui-smoke-output.log
          if-no-files-found: error

      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rts-smoke-screenshot
          path: rts-smoke.png
          if-no-files-found: ignore

      - name: Stop on browser failure
        if: steps.browser_test.outputs.status != '0'
        run: exit 1
