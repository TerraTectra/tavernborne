name: Public Interaction Polish v1 verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Wait for public GitHub Pages
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent https://terratectra.github.io/tavernborne/ > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Verify public Interaction Polish v1
        env:
          TEST_URL: https://terratectra.github.io/tavernborne/
        run: node scripts/interaction-polish-smoke.mjs

      - name: Upload public interaction verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-interaction-polish-v1-verification
          path: |
            interaction-polish-diagnostics.json
            interaction-polish-domestic.png
            interaction-polish-physical.png
            interaction-polish-council.png
            interaction-polish-final.png
          if-no-files-found: ignore
