name: Social Choreography v1 smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build application and assets
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > social-choreography-preview.log 2>&1 &
          echo $! > social-choreography-preview.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/tavernborne/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat social-choreography-preview.log
          exit 1

      - name: Test Social Choreography v1 in Chromium
        run: node scripts/social-choreography-smoke.mjs

      - name: Upload choreography diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-choreography-v1-diagnostics
          path: |
            social-choreography-diagnostics.json
            social-choreography-pair.png
            social-choreography-treatment.png
            social-choreography-conflict.png
            social-choreography-table.png
            social-choreography-line.png
            social-choreography-final.png
            social-choreography-preview.log
          if-no-files-found: ignore
