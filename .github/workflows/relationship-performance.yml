name: Relationship Performance v1 smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build application and assets
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > relationship-performance-preview.log 2>&1 &
          echo $! > relationship-performance-preview.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/tavernborne/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat relationship-performance-preview.log
          exit 1

      - name: Test Relationship Performance v1 in Chromium
        run: node scripts/relationship-performance-smoke.mjs

      - name: Upload relationship diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-performance-v1-diagnostics
          path: |
            relationship-performance-diagnostics.json
            relationship-performance-*.png
            relationship-performance-preview.log
          if-no-files-found: ignore
