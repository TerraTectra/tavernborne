name: Modular appearance smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build application and curated assets
        run: npm run build 2>&1 | tee modular-appearance-build.log

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/tavernborne-modular-preview.log 2>&1 &
          echo $! > /tmp/tavernborne-modular-preview.pid
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/tavernborne/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tavernborne-modular-preview.log
          exit 1

      - name: Test modular hero appearances
        run: node scripts/modular-appearance-smoke.mjs

      - name: Upload appearance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-appearance-diagnostics
          path: |
            modular-appearance-build.log
            modular-appearance-diagnostics.json
            modular-appearance-*.png
          if-no-files-found: ignore
