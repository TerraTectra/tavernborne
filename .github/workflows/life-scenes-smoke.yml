name: Visual daily life smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/tavernborne-life-preview.log 2>&1 &
          echo $! > /tmp/tavernborne-life-preview.pid
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/tavernborne/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tavernborne-life-preview.log
          exit 1

      - name: Test visual daily life in Chromium
        run: node scripts/life-scenes-smoke.mjs

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-daily-life-diagnostics
          path: life-scenes-diagnostics.json
          if-no-files-found: ignore

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-daily-life-screenshot
          path: life-scenes-smoke.png
          if-no-files-found: ignore
