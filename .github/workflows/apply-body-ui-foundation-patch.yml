name: Apply body and UI foundation patch

on:
  push:
    branches:
      - agent/physical-simulation-ui-foundation
    paths:
      - scripts/apply-body-ui-foundation-patch.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/physical-simulation-ui-foundation
          fetch-depth: 0

      - name: Apply exact source patch
        run: node scripts/apply-body-ui-foundation-patch.mjs

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rts/realtime.ts src/three/AssetHeroBody3D.tsx
          git commit -m "Repair sleep bodies and dialogue spacing"
          git push origin HEAD:agent/physical-simulation-ui-foundation
