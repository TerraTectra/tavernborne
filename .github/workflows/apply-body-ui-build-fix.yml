name: Apply body UI build fix

on:
  push:
    branches:
      - agent/physical-simulation-ui-foundation
    paths:
      - scripts/apply-body-ui-build-fix.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physical-simulation-ui-foundation
          fetch-depth: 0
      - run: node scripts/apply-body-ui-build-fix.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/three/AssetHeroBody3D.tsx
          git commit -m "Complete 3D actor scene typing"
          git push origin HEAD:agent/physical-simulation-ui-foundation
