name: Verify live leadership release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-leadership-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Test public GitHub Pages
        env:
          TEST_URL: https://terratectra.github.io/tavernborne/
        run: node scripts/ui-smoke.mjs

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-leadership-screenshot
          path: rts-smoke.png
          if-no-files-found: ignore
