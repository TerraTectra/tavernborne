name: Verify public physical UI foundation

on:
  pull_request:
    branches:
      - verify-base/physical-ui-public

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4
        with:
          ref: eacc880890fe4f10da607e591bffe97cb69750eb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify merged public deployment
        run: |
          for attempt in {1..8}; do
            echo "Public verification attempt $attempt"
            if TEST_URL=https://terratectra.github.io/tavernborne/ node scripts/physical-ui-foundation-smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then
              sleep 30
            fi
          done
          exit 1

      - name: Upload public diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-physical-ui-diagnostics
          path: |
            physical-ui-diagnostics.json
            physical-ui-*.png
          if-no-files-found: ignore
