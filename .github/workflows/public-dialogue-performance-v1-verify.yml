name: Public Dialogue Performance v1 verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Wait for merged public bundle
        run: |
          set -euo pipefail
          PUBLIC_URL="https://terratectra.github.io/tavernborne/"
          html_file="$(mktemp)"
          bundle_file="$(mktemp)"
          trap 'rm -f "$html_file" "$bundle_file"' EXIT
          for attempt in {1..72}; do
            : > "$html_file"
            : > "$bundle_file"
            curl -fsS "$PUBLIC_URL" -o "$html_file" || true
            asset="$(grep -oE 'assets/index-[^"[:space:]]+\.js' "$html_file" | head -n 1 || true)"
            if [ -n "$asset" ]; then
              curl -fsS "${PUBLIC_URL}${asset}" -o "$bundle_file" || true
              if grep -Fq 'data-dialogue-performance' "$bundle_file" \
                && grep -Fq 'dialogueMemoryId' "$bundle_file" \
                && grep -Fq 'Скажу прямо' "$bundle_file"; then
                echo "Merged Dialogue Performance v1 bundle found: $asset"
                exit 0
              fi
            fi
            echo "Attempt $attempt: merged bundle not visible yet"
            sleep 10
          done
          echo "Merged Dialogue Performance v1 bundle was not published in time"
          exit 1

      - name: Verify public Dialogue Performance v1 in Chromium
        env:
          TEST_URL: https://terratectra.github.io/tavernborne/
        run: node scripts/dialogue-performance-smoke.mjs

      - name: Upload public dialogue verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-dialogue-performance-v1-verification
          path: |
            dialogue-performance-diagnostics.json
            dialogue-performance-warm.png
            dialogue-performance-memory.png
            dialogue-performance-wounded.png
            dialogue-performance-leader.png
            dialogue-performance-final.png
          if-no-files-found: ignore
