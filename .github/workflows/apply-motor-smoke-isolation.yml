name: Apply motor smoke isolation

on:
  push:
    branches:
      - agent/body-affinity-motor-memory-v1
    paths:
      - scripts/apply-motor-smoke-isolation.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/body-affinity-motor-memory-v1
          fetch-depth: 0
      - run: node scripts/apply-motor-smoke-isolation.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/body-affinity-motor-memory-smoke.mjs
          git commit -m "Isolate each motor practice hour"
          git push origin HEAD:agent/body-affinity-motor-memory-v1
