name: Commitment Negotiation v1 smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build application and assets
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > commitment-negotiation-preview.log 2>&1 &
          echo $! > commitment-negotiation-preview.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/tavernborne/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat commitment-negotiation-preview.log
          exit 1

      - name: Test Commitment Negotiation outcomes in Chromium
        run: node scripts/commitment-negotiation-smoke.mjs

      - name: Test negotiation dialogue loop protection
        run: node scripts/commitment-negotiation-loop-smoke.mjs

      - name: Upload commitment negotiation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commitment-negotiation-v1-diagnostics
          path: |
            commitment-negotiation-diagnostics.json
            commitment-negotiation-accepted.png
            commitment-negotiation-countered.png
            commitment-negotiation-refused.png
            commitment-negotiation-final.png
            commitment-negotiation-loop-diagnostics.json
            commitment-negotiation-loop.png
            commitment-negotiation-loop-final.png
            commitment-negotiation-preview.log
          if-no-files-found: ignore
